name: Bootstrap WarPy40K v1.5 Codex Modules

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v1.5 implementation
        run: python scripts/apply_v15.py

      - name: Preserve contextual module identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/warpy40k/parser.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        if token.type == TokenType.IDENTIFIER and token.value == "Invoke":\n'
              '            return self._parse_import_statement()\n'
              '        if token.type == TokenType.IDENTIFIER and token.value == "Codex":\n'
              '            return self._parse_export_statement()\n',
              '        if self._looks_like_import_statement():\n'
              '            return self._parse_import_statement()\n'
              '        if self._looks_like_export_statement():\n'
              '            return self._parse_export_statement()\n',
              1,
          )
          marker = '    def _parse_import_statement(self) -> ImportNode:\n'
          helpers = '''    def _looks_like_import_statement(self) -> bool:\n        token = self.current_token\n        if token is None or token.type != TokenType.IDENTIFIER or token.value != "Invoke":\n            return False\n        if self.position + 2 >= len(self.tokens):\n            return False\n        name = self.tokens[self.position]\n        from_token = self.tokens[self.position + 1]\n        codex = self.tokens[self.position + 2]\n        return (\n            name.type == TokenType.IDENTIFIER\n            and from_token.type == TokenType.IDENTIFIER\n            and from_token.value == "from"\n            and codex.type == TokenType.IDENTIFIER\n            and codex.value == "Codex"\n        )\n\n    def _looks_like_export_statement(self) -> bool:\n        token = self.current_token\n        if token is None or token.type != TokenType.IDENTIFIER or token.value != "Codex":\n            return False\n        if self.position >= len(self.tokens):\n            return False\n        marker = self.tokens[self.position]\n        return marker.type == TokenType.IDENTIFIER and marker.value == "Export"\n\n'''
          if marker not in text:
              raise SystemExit("parser import marker not found")
          text = text.replace(marker, helpers + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m black src tests benchmarks
          python -m isort src tests benchmarks
          python -m flake8 src tests benchmarks
          python -m mypy src/warpy40k
          python -m pytest -q

      - name: Commit implementation
        run: |
          rm .github/workflows/bootstrap-v1.5.yml
          rm scripts/apply_v15.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement v1.5 Codex modules"
          git push
