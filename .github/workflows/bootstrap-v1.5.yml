name: Bootstrap WarPy40K v1.5 Codex Modules

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v1.5 implementation
        run: python scripts/apply_v15.py

      - name: Validate implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m black src tests benchmarks
          python -m isort src tests benchmarks
          python -m flake8 src tests benchmarks
          python -m mypy src/warpy40k
          python -m pytest -q

      - name: Commit implementation
        run: |
          rm .github/workflows/bootstrap-v1.5.yml
          rm scripts/apply_v15.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement v1.5 Codex modules"
          git push
