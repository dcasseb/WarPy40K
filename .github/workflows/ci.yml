name: WarPy40K CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=7,<9"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke benchmark suite
        run: python benchmarks/run_benchmarks.py --samples 1

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check --diff src tests benchmarks

      - name: Check import order
        run: python -m isort --check-only src tests benchmarks

      - name: Lint
        run: python -m flake8 src tests benchmarks

      - name: Type-check
        run: python -m mypy src/warpy40k

      - name: Test with coverage gate
        run: >-
          python -m pytest -q
          --cov=warpy40k
          --cov-report=term-missing
          --cov-fail-under=80
