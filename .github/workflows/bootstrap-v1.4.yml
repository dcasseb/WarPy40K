name: Bootstrap WarPy40K v1.4 Contracts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: bootstrap v1.4 contracts'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v1.4 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Parser imports.
          replace(
              "src/warpy40k/parser.py",
              "    ChaosExprNode,\n    CurseExprNode,",
              "    ChaosExprNode,\n    ContractAssertionNode,\n    ContractClauseNode,\n    CurseExprNode,",
          )

          # Statement-level Inquisition Assert.
          replace(
              "src/warpy40k/parser.py",
              "        if token.type == TokenType.WARP:\n            return self._parse_warp_statement()\n        if token.type == TokenType.LBRACE:",
              "        if token.type == TokenType.WARP:\n            return self._parse_warp_statement()\n        if token.type == TokenType.INQUISITION and self._next_identifier_is(\"Assert\"):\n            return self._parse_contract_assertion()\n        if token.type == TokenType.LBRACE:",
          )

          replace(
              "src/warpy40k/parser.py",
              "    def _parse_if_statement(self) -> IfStatementNode:\n",
              "    def _next_identifier_is(self, value: str) -> bool:\n        if self.position >= len(self.tokens):\n            return False\n        token = self.tokens[self.position]\n        return token.type == TokenType.IDENTIFIER and token.value == value\n\n    def _parse_contract_assertion(self) -> ContractAssertionNode:\n        token = self._expect(TokenType.INQUISITION)\n        marker = self._expect(TokenType.IDENTIFIER, \"Expected 'Assert' after Inquisition\")\n        if marker.value != \"Assert\":\n            raise SyntaxError(\n                f\"Expected 'Assert' after Inquisition at line {marker.line}, \"\n                f\"column {marker.column}\"\n            )\n        condition = self._parse_expression()\n        if self.current_token and self.current_token.type == TokenType.SEMICOLON:\n            self._advance()\n        return ContractAssertionNode(condition, token.line, token.column)\n\n    def _parse_if_statement(self) -> IfStatementNode:\n",
          )

          # Function contracts between signature and body.
          old_function_tail = '''        self._expect(TokenType.RPAREN, "Expected ')' after function parameters")
        if not self.current_token or self.current_token.type != TokenType.LBRACE:
            raise SyntaxError(
                f"Function '{name_token.value}' requires a block body "
                f"at line {def_token.line}, column {def_token.column}"
            )
        body = self._parse_block()
        return FunctionDefinitionNode(
            name_token.value, parameters, body, def_token.line, def_token.column
        )'''
          new_function_tail = '''        self._expect(TokenType.RPAREN, "Expected ')' after function parameters")
        requires: List[ContractClauseNode] = []
        ensures: List[ContractClauseNode] = []
        while self.current_token and self.current_token.type == TokenType.INQUISITION:
            clause_token = self.current_token
            if self.position >= len(self.tokens):
                break
            marker = self.tokens[self.position]
            if marker.type != TokenType.IDENTIFIER or marker.value not in (
                "Requires",
                "Ensures",
            ):
                break
            self._advance()
            self._advance()
            condition = self._parse_expression()
            clause = ContractClauseNode(
                condition,
                marker.value.lower(),
                clause_token.line,
                clause_token.column,
            )
            if marker.value == "Requires":
                requires.append(clause)
            else:
                ensures.append(clause)
        if not self.current_token or self.current_token.type != TokenType.LBRACE:
            raise SyntaxError(
                f"Function '{name_token.value}' requires a block body "
                f"at line {def_token.line}, column {def_token.column}"
            )
        body = self._parse_block()
        return FunctionDefinitionNode(
            name_token.value,
            parameters,
            body,
            def_token.line,
            def_token.column,
            requires,
            ensures,
        )'''
          replace("src/warpy40k/parser.py", old_function_tail, new_function_tail)

          # Interpreter imports.
          replace(
              "src/warpy40k/interpreter.py",
              "    ChaosExprNode,\n    CurseExprNode,",
              "    ChaosExprNode,\n    ContractAssertionNode,\n    ContractClauseNode,\n    CurseExprNode,",
          )

          # UserFunction carries contracts.
          replace(
              "src/warpy40k/interpreter.py",
              "class UserFunction:\n    name: str\n    parameters: List[str]\n    body: BlockNode\n    closure: Tuple[Dict[str, Any], ...]",
              "class UserFunction:\n    name: str\n    parameters: List[str]\n    body: BlockNode\n    closure: Tuple[Dict[str, Any], ...]\n    requires: Tuple[ContractClauseNode, ...] = tuple()\n    ensures: Tuple[ContractClauseNode, ...] = tuple()",
          )

          # Contract error type.
          replace(
              "class _ReturnSignal(Exception):\n",
              "class ContractViolation(RuntimeError):\n    \"\"\"Raised when an enabled Inquisition contract evaluates false.\"\"\"\n\n\nclass _ReturnSignal(Exception):\n",
          )

          # Interpreter flag.
          replace(
              "    def __init__(self, warp_replay: Optional[List[float]] = None) -> None:\n",
              "    def __init__(\n        self,\n        warp_replay: Optional[List[float]] = None,\n        contracts_enabled: bool = True,\n    ) -> None:\n",
          )
          replace(
              "        self._warp_replay_index = 0\n        self._init_builtins()",
              "        self._warp_replay_index = 0\n        self.contracts_enabled = contracts_enabled\n        self._init_builtins()",
          )

          # Execute assertion node.
          replace(
              "        if isinstance(node, WarpStatementNode):\n            return self._execute_warp_statement(node)\n        if isinstance(node, BlockNode):",
              "        if isinstance(node, WarpStatementNode):\n            return self._execute_warp_statement(node)\n        if isinstance(node, ContractAssertionNode):\n            return self._execute_contract_assertion(node)\n        if isinstance(node, BlockNode):",
          )

          # Function definition carries contracts.
          replace(
              "        function = UserFunction(\n            node.name, list(node.parameters), node.body, tuple(self._scopes)\n        )",
              "        function = UserFunction(\n            node.name,\n            list(node.parameters),\n            node.body,\n            tuple(self._scopes),\n            tuple(node.requires),\n            tuple(node.ensures),\n        )",
          )

          # Replace user function call runtime with contract checks.
          old_call = '''        local_scope: Dict[str, Any] = dict(zip(function.parameters, args))
        previous_scopes = self._scopes
        self._scopes = list(function.closure) + [local_scope]
        self._function_depth += 1
        try:
            try:
                self.execute(function.body)
            except _ReturnSignal as signal:
                return signal.value
            return None
        finally:
            self._function_depth -= 1
            self._scopes = previous_scopes'''
          new_call = '''        local_scope: Dict[str, Any] = dict(zip(function.parameters, args))
        previous_scopes = self._scopes
        self._scopes = list(function.closure) + [local_scope]
        self._function_depth += 1
        try:
            if self.contracts_enabled:
                for clause in function.requires:
                    self._check_contract(clause, "precondition", function.name)
            try:
                self.execute(function.body)
                result = None
            except _ReturnSignal as signal:
                result = signal.value
            if self.contracts_enabled:
                had_result = "result" in local_scope
                previous_result = local_scope.get("result")
                local_scope["result"] = result
                try:
                    for clause in function.ensures:
                        self._check_contract(clause, "postcondition", function.name)
                finally:
                    if had_result:
                        local_scope["result"] = previous_result
                    else:
                        local_scope.pop("result", None)
            return result
        finally:
            self._function_depth -= 1
            self._scopes = previous_scopes'''
          replace("src/warpy40k/interpreter.py", old_call, new_call)

          # Contract helpers before if execution.
          replace(
              "    def _execute_if_statement(self, node: IfStatementNode) -> Any:\n",
              '''    def _contract_values(self, condition: ASTNode) -> str:
        names: List[str] = []

        def visit(value: Any) -> None:
            if isinstance(value, IdentifierNode):
                if value.name not in names:
                    names.append(value.name)
                return
            if isinstance(value, ASTNode):
                for field_value in vars(value).values():
                    visit(field_value)
                return
            if isinstance(value, (list, tuple)):
                for item in value:
                    visit(item)

        visit(condition)
        rendered = []
        for name in names:
            try:
                rendered.append(f"{name}={self._lookup(name)!r}")
            except NameError:
                pass
        return ", ".join(rendered)

    def _check_contract(
        self, clause: ContractClauseNode, kind: str, function_name: str
    ) -> None:
        passed = bool(self.execute(clause.condition))
        if passed:
            return
        values = self._contract_values(clause.condition)
        detail = f"; values: {values}" if values else ""
        raise ContractViolation(
            f"Inquisition {kind} failed in function '{function_name}' "
            f"at line {clause.line}, column {clause.column}: "
            f"{clause.condition!r}{detail}"
        )

    def _execute_contract_assertion(self, node: ContractAssertionNode) -> bool:
        if not self.contracts_enabled:
            return True
        if bool(self.execute(node.condition)):
            return True
        values = self._contract_values(node.condition)
        detail = f"; values: {values}" if values else ""
        raise ContractViolation(
            f"Inquisition assertion failed at line {node.line}, "
            f"column {node.column}: {node.condition!r}{detail}"
        )

    def _execute_if_statement(self, node: IfStatementNode) -> Any:
''',
          )

          # Version metadata.
          replace("src/warpy40k/__init__.py", '__version__ = "1.3.0"', '__version__ = "1.4.0"')
          replace("pyproject.toml", 'version = "1.3.0"', 'version = "1.4.0"')

          # Export ContractViolation at package level.
          replace(
              "from .interpreter import Interpreter",
              "from .interpreter import ContractViolation, Interpreter",
          )
          replace(
              '    "Interpreter",\n',
              '    "Interpreter",\n    "ContractViolation",\n',
          )

          # Documentation.
          Path("docs/inquisition_contracts.md").write_text(
              '''# Inquisition Contracts\n\nWarPy40K v1.4 turns judgment into executable specification.\n\n## Assertions\n\n```text\nInquisition Assert health > 0\n```\n\nAn enabled assertion evaluates its condition exactly once. A false result raises `ContractViolation` with source location, the failed AST condition, and values for identifiers referenced by the condition.\n\n## Preconditions and postconditions\n\nContracts attach to functions between the parameter list and body:\n\n```text\ndef heal(health, amount)\nInquisition Requires health > 0\nInquisition Requires amount > 0\nInquisition Ensures result >= health\n{\n    return health + amount\n}\n```\n\n`Requires` clauses execute after arguments are bound but before the function body. `Ensures` clauses execute after the function result is known. Postconditions can refer to parameters and to the temporary pseudo-value `result`. The `result` binding never leaks after the call. Multiple clauses execute in source order and stop on the first violation.\n\n## Optional checking\n\nThe Python API can disable contract checking:\n\n```python\nInterpreter(contracts_enabled=False)\n```\n\nWhen disabled, assertion, precondition, and postcondition expressions are not evaluated at all. This is important both for predictable semantics and for measuring validation overhead separately from normal execution.\n\n## Compatibility\n\nExisting expression semantics remain intact:\n\n```text\njudgment = Inquisition health\n```\n\n`Assert`, `Requires`, and `Ensures` are contextual identifiers used only after `Inquisition` in contract positions; they are not new global reserved words.\n\n## Performance\n\nContract-disabled execution keeps only the structural function metadata and a Boolean branch at function-call/assertion boundaries. Contract-enabled benchmarks should be reported separately so the cost of executable specification is explicit rather than hidden.\n''',
              encoding="utf-8",
          )

          # Changelog.
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          marker = "# Changelog\n\nAll notable changes to WarPy40K are recorded here.\n\n"
          entry = '''## 1.4.0 — 2026-09-04\n\n### Added\n\n- `Inquisition Assert <condition>` executable assertions with source locations.\n- Function `Inquisition Requires <condition>` preconditions.\n- Function `Inquisition Ensures <condition>` postconditions with temporary `result` binding.\n- `ContractViolation` diagnostics containing contract kind, function/location, condition, and relevant identifier values.\n- `Interpreter(contracts_enabled=False)` for explicitly disabling runtime contract evaluation.\n\n### Semantics\n\n- Preconditions run after parameter binding and before function-body execution.\n- Postconditions run after explicit or implicit function return values are determined.\n- Disabled contracts do not evaluate their condition expressions.\n- Multiple Requires/Ensures clauses execute in source order and fail fast.\n- Existing `Inquisition value` Boolean judgment remains compatible.\n- `Assert`, `Requires`, and `Ensures` remain contextual identifiers rather than globally reserved words.\n\n'''
          if entry not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG marker not found")
              p.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          # Roadmap status and docs index.
          p = Path("docs/roadmap.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "## v1.4 — Inquisition Contracts\n",
              "## v1.4 — Inquisition Contracts ✅\n",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("docs/index.md")
          text = p.read_text(encoding="utf-8")
          if "inquisition_contracts.md" not in text:
              anchor = "- [Warp Effect Model](warp_effect_model.md) — deterministic nondeterminism, trace recording, and replay.\n"
              addition = anchor + "- [Inquisition Contracts](inquisition_contracts.md) — assertions, preconditions, postconditions, and optional runtime checking.\n"
              if anchor in text:
                  text = text.replace(anchor, addition, 1)
              else:
                  text += "\n- [Inquisition Contracts](inquisition_contracts.md)\n"
          p.write_text(text, encoding="utf-8")

          # README version and feature summary.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("**Current version: 1.3.0**", "**Current version: 1.4.0**", 1)
          heading = "## Core language\n"
          section = '''## WarPy40K 1.4 — Inquisition Contracts\n\nVersion **1.4.0** turns judgment into executable specification with assertions, function preconditions, and postconditions:\n\n```text\ndef heal(health, amount)\nInquisition Requires health > 0\nInquisition Requires amount > 0\nInquisition Ensures result >= health\n{\n    return health + amount\n}\n\nInquisition Assert heal(10, 5) == 15\n```\n\nContract checking can be disabled through `Interpreter(contracts_enabled=False)`; disabled conditions are not evaluated. Existing `Inquisition value` expression semantics remain unchanged. See [`docs/inquisition_contracts.md`](docs/inquisition_contracts.md).\n\n'''
          if section not in text and heading in text:
              text = text.replace(heading, section + heading, 1)
          if "[`docs/inquisition_contracts.md`](docs/inquisition_contracts.md)" not in text:
              text = text.replace(
                  "- [`docs/warp_effect_model.md`](docs/warp_effect_model.md) — deterministic Warp regions, recording, and replay\n",
                  "- [`docs/warp_effect_model.md`](docs/warp_effect_model.md) — deterministic Warp regions, recording, and replay\n- [`docs/inquisition_contracts.md`](docs/inquisition_contracts.md) — assertions and function contracts\n",
              )
          p.write_text(text, encoding="utf-8")

          # Remove one-shot bootstrap workflow from resulting commit.
          Path(".github/workflows/bootstrap-v1.4.yml").unlink(missing_ok=True)
          PY

      - name: Validate implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m black src tests benchmarks
          python -m isort src tests benchmarks
          python -m flake8 src tests benchmarks
          python -m mypy src
          python -m pytest -q

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement v1.4 Inquisition contracts"
          git push origin HEAD:main
