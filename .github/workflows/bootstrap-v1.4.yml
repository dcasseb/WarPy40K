name: Bootstrap WarPy40K v1.4 Contracts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v1.4 implementation
        run: python scripts/implement_v14.py

      - name: Validate implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m black src tests benchmarks
          python -m isort src tests benchmarks
          python -m flake8 src tests benchmarks
          python -m mypy src
          python -m pytest -q

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement v1.4 Inquisition contracts"
          git push origin HEAD:main
