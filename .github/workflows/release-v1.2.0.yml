name: Publish WarPy40K v1.2.0

on:
  workflow_run:
    workflows: ["WarPy40K CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_commit.message == 'chore: prepare v1.2.0 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin refs/tags/v1.2.0 >/dev/null 2>&1; then
            echo "Tag v1.2.0 already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.2.0 "$VALIDATED_SHA" -m "WarPy40K v1.2.0"
          git push origin refs/tags/v1.2.0

          cat > /tmp/release-notes.md <<'EOF'
          # WarPy40K 1.2.0 — Orders, Native Data & Performance Baseline

          WarPy40K 1.2.0 consolidates the language evolution since v1.0.1 with native structured data, pattern-oriented command dispatch, an official performance baseline, and a documented path toward the independent Forge Runtime.

          ## Highlights

          ### Native structured data

          - `Squad[...]` ordered mutable collections.
          - `Dataslate{field: value}` immutable-by-default structured records.
          - Explicit `Deploy`, `Extract`, and `Reassign` Squad operations.
          - Persistent `Inscribe` and `Erase` Dataslate transformations.
          - Native indexing, field access, structural equality, and `len()` support.

          ### Orders and pattern dispatch

          - `Order target { ... }` with ordered first-match-wins semantics.
          - `When pattern { ... }` and optional `Otherwise`.
          - Literal, wildcard, binding, Squad, and partial Dataslate patterns.
          - Optional guards with `When pattern if condition`.
          - Scoped pattern bindings and dedicated pattern AST nodes.

          ### Official showcase

          *The Vault of Vharax* now uses native Squads, Dataslates, and Orders for its world model, inventory, exploration, and combat command dispatch.

          ### Performance baseline

          WarPy40K now includes an official benchmark suite covering:

          - arithmetic loops;
          - user-defined function calls;
          - recursion;
          - `Order` dispatch;
          - `Squad` operations;
          - persistent `Dataslate` updates;
          - the encoded two-counter Minsky interpreter.

          The suite separates execution-only from end-to-end timings, reports median and p95 latency, supports JSON output, and includes equivalent Python baselines where practical. v1.2 is now the historical tree-walker performance baseline for future Forge VM work.

          ### Forge Runtime direction

          The roadmap and architecture documentation now make performance a first-class language-platform objective. The long-term execution path is:

          `Python reference interpreter -> Forge bytecode -> native Forge VM -> native value model -> multicore scheduler/native kernels -> optional JIT/AOT`

          Key targets include:

          - at least 10x geometric-mean execution-only speedup for the v1.9 Forge VM over the v1.2 tree walker;
          - common scalar/control-flow workloads within roughly 10x CPython by v2.0;
          - at least 3x throughput with four workers and 5x with eight workers where hardware/workload permit;
          - a long-term 1,000-entity, 60 Hz simulation target within a 16.67 ms update budget on documented reference hardware.

          Python remains the current implementation host and future semantic/reference interpreter, but it is no longer treated as the permanent production-runtime ceiling.

          ## Quality

          The release is published only after the full WarPy40K CI succeeds on the exact tagged commit. CI covers Python 3.8, 3.10, and 3.12, benchmark smoke execution, formatting, import order, linting, typing, tests, and coverage gates.

          See `CHANGELOG.md`, `benchmarks/README.md`, `docs/roadmap.md`, and `docs/forge_runtime.md` for the full details.

          **For the Emperor!**
          EOF

          gh release create v1.2.0 \
            --verify-tag \
            --target "$VALIDATED_SHA" \
            --title "WarPy40K 1.2.0 — Orders, Native Data & Performance Baseline" \
            --notes-file /tmp/release-notes.md
