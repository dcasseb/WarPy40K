name: Release WarPy40K v1.6.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.6.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v1.6.0
      TARGET_SHA: a3fb6c92fc839a66046387f12eb596050d1af733
      RELEASE_TITLE: "WarPy40K 1.6.0 — Sanctioned Effects"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact milestone CI succeeded
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "WarPy40K CI" and .head_sha == env.TARGET_SHA)] | sort_by(.run_number) | last | .conclusion')"
          test "$conclusion" = "success"

      - name: Create annotated milestone tag
        run: |
          git fetch --tags origin
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "$RELEASE_TITLE"
          git push origin "$TAG"

      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          # WarPy40K 1.6.0 — Sanctioned Effects

          WarPy40K 1.6.0 moves externally visible side effects toward explicit authorization without breaking established 1.x computation and console workflows.

          ## Explicit effect regions

          - New `Sanction capability { ... }` and `Sanction a, b { ... }` runtime regions.
          - Host-controlled capability grants; WarPy40K source cannot grant its own privileges.
          - Nested regions cannot elevate capabilities; cleanup is guaranteed after returns and errors.
          - Imported Codices share the active effect context and cannot bypass the host grant policy.
          - `EffectViolation` diagnostics for missing, unknown, or escalating capabilities.

          ## Built-ins and host boundaries

          - `console`: `print()` and `input()`.
          - `file_read`: `ReadFile(path)`; `file_write`: `WriteFile(path, string)`.
          - `environment`: `GetEnv(name)`.
          - `time`: `Clock()`.
          - `process`: `exit(code)`.
          - Host-configured `file_root` restricts resolved file paths, including symlink escape checks.
          - New CLI host options: `--grant`, `--strict-effects`, and `--file-root`.

          ## Compatibility and limitations

          - Legacy ambient console and process effects remain available by default for 1.x compatibility.
          - In strict mode, even console/process effects require an active sanctioned region.
          - File/environment/time operations always require a host grant and an active region.
          - No network support in v1.6.
          - Authorization is dynamic, not a static effect type system.
          - Path checks are not a race-free OS sandbox; use process isolation for untrusted code.

          ## Validation

          The exact tagged commit passed WarPy40K CI across Python 3.8, 3.10 and 3.12, including regression tests, formatting, import order, lint, type checking, coverage gate, and smoke tests for canonical, contract, module and effects benchmarks.

          Full technical semantics and security limitations: `docs/sanctioned_effects.md`.

          **For the Emperor!**
          EOF
          gh release create "$TAG" --verify-tag --target "$TARGET_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md
